---
#
# PLEASE NOTE: Managed workflow - do not change manually
#
name: Check commit conventions

on:
  pull_request:
    branches:
      - "*"

jobs:
  verify-commits:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        # https://github.com/taskmedia/action-conventional-commits
      - uses: taskmedia/action-conventional-commits@dfe6c600130f3cb9dc90361aa4228a95840f72fc # v1.3.1
        with:
          types: "feat|fix|refactor|revert|ci|chore|docs|build|perf|test|style"
          skip_revert: false
