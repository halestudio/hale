name: Check labels

on:
  pull_request:
    branches:
      - master  # Trigger only on PRs to master
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  require-challenge:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: minimum
          count: 1
          labels: |
            challenged
            renovate/patch
            renovate/minor
          add_comment: ${{ ! github.event.pull_request.head.repo.fork }}
          message: "This PR cannot be merged yet because a required label is missing: `{{ provided }}`. It needs to be added before this PR can be merged."
