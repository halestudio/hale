name: Windows installer

on:
  push:
    branches:
      - master
      # temporarily also for the integration branch of hale»studio on hale-core
      - next
  workflow_dispatch: {}

jobs:
  installer:
    # Only on main repository (don't publish on forks)
    if: github.repository_owner == 'halestudio'

    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build
        uses: ./.github/actions/setup-build

      - name: Restore generated platform
        id: restore-platform
        uses: ./.github/actions/restore-platform

      - name: Build installer
        run: |
          build.bat product -o windows -a x86_64 HALE
        shell: cmd

      - name: Save generated platform
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-platform
        with:
          platform-key: ${{ steps.restore-platform.outputs.platform-key }}
          eclipse-cache-hit: ${{ steps.restore-platform.outputs.eclipse-cache-hit }}

      - name: Upload hale studio build (Installer)
        id: upload-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hale studio (Installer)
          path: build/target/*.msi
          retention-days: 90
