name: Set up build
description: >-
  Install the tools defined in mise.toml (or the tools of releases before mise.toml was introduced)
  and restore the local Maven repository used by the embedded Maven of the build. Requires the
  repository to be checked out.
runs:
  using: composite
  steps:
    - name: Install tools
      if: hashFiles('mise.toml') != ''
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

    # Release tags from before mise.toml was introduced were built with Temurin 17
    - name: Install tools (no mise.toml)
      if: hashFiles('mise.toml') == ''
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        mise_toml: |
          [tools]
          java = "temurin-17"

    # The POMs are generated by the build, so the key is derived from the files they are generated
    # from. An entry is saved whenever the key changes and the most recent one is restored otherwise.
    - name: Cache local Maven repository
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: maven-${{ runner.os }}-${{ hashFiles('mise.toml', 'platform/*.target', 'build/templates/pom-*.xml', 'build/buildSrc/build.gradle') }}
        restore-keys: maven-${{ runner.os }}-
